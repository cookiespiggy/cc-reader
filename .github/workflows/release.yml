name: Release (unsigned macOS)

# 无 Apple Developer 凭据的分发路线（见 DESIGN.md §9.1）：
# tag 触发后在 macOS runner 上出 .dmg，直接传到 GitHub Release。
# Gatekeeper 的首次放行由用户完成，README「下载与首次打开」有说明。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Rebuild icons from hand-written SVG
        run: bash scripts/build-icons.sh

      - name: Build .app + .dmg (unsigned)
        run: bun run build

      - name: Upload dmg to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 两个架构的 job 会并发跑，第一个创建 release，第二个复用
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber
